name: jobs-pool-refresh

# R2 jobs pool freshness — the EXTERNAL scheduler the crawler/trends tools assume
# (in-process @nestjs/schedule is deliberately avoided; Cloud Run min=0 sleeps).
#   • crawl ITviec → ingest/refresh real JD postings (best-effort: CI IPs may be WAF-limited)
#   • refresh trends → materialize skill_demand_snapshots (DB-only, always reliable)
#
# Secrets required (repo → Settings → Secrets → Actions):
#   DATABASE_URL    (Supabase, same as BE)
#   OPENAI_API_KEY  (job embeddings during ingest)
# INTERNAL_AUTH_SECRET is set to a literal below — the crawl/trends CLI path never uses it,
# but the shared AppModule config validation requires min length 16.
on:
  schedule:
    - cron: '0 19 * * *' # 02:00 ICT — crawl
    - cron: '30 20 * * *' # 03:30 ICT — trends (after the crawl window)
    - cron: '0 */6 * * *' # every 6h — business-jobs maintenance (notification retry + PDPL PII purge + job expiry)
  workflow_dispatch:
    inputs:
      task:
        description: 'which step to run'
        type: choice
        default: both
        options: [both, crawl, trends, maintenance]

env:
  # development (not production) → relax prod-only required env (RESEND/GCS) the CLI doesn't need.
  NODE_ENV: development
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DB_SSL: 'true'
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  INTERNAL_AUTH_SECRET: ci-cron-secret-not-used-by-this-path
  # Config validation requires these even outside NODE_ENV=test (the joi `.when` only relaxes
  # them for 'test'). The crawl/trends CLI never actually uses GCS/email — literals satisfy
  # boot validation while keeping NODE_ENV=development (so skill normalization behaves like local).
  GCS_BUCKET: skillbridge-cv
  # crawl/trends never send email (literal fallback keeps boot validation happy).
  # The maintenance job DOES send: set the RESEND_API_KEY repo secret to enable
  # real delivery. Without it, email retries keep failing but the DB-only
  # maintenance (PDPL PII purge + job expiry + retention) still runs.
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_cron_not_used' }}
  RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'SkillBridge <noreply@skillbridge.vn>' }}

jobs:
  crawl:
    if: github.event.schedule == '0 19 * * *' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["crawl","both"]'), github.event.inputs.task))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --trust-lockfile
      # 200 detail pages/run (~13 min at the 4s/req polite rate). Idempotent UPSERT on
      # (source_name, external_id); stale postings age out via the crawler's expiry pass.
      - name: Crawl ITviec (best-effort)
        run: pnpm jobs:crawl 200

  trends:
    if: github.event.schedule == '30 20 * * *' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["trends","both"]'), github.event.inputs.task))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --trust-lockfile
      # Materialize a daily skill_demand_snapshot. trend_delta needs ≥2 daily periods,
      # so "emerging skills" becomes meaningful after this has run on 2+ days.
      - name: Refresh skill-demand trends
        run: pnpm trends:refresh

  maintenance:
    # The external scheduler for BusinessJobsMaintenanceService. Without this,
    # a failed status/apply email is never retried and the PDPL PII purge never
    # runs (bug hunt R3 07-22 — the retry/backoff machinery was dead wiring).
    #   • expireDueEmployerJobs + scheduleEndedJobRetention (DB-only)
    #   • purgeDueApplicationPii (PDPL compliance, DB-only)
    #   • processPendingNotifications (retries FAILED/PENDING emails on backoff)
    if: github.event.schedule == '0 */6 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'maintenance')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - name: Run business-jobs maintenance sweep
        run: pnpm business-jobs:maintenance
